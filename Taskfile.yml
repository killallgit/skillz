version: '3'

tasks:
  dev:
    desc: Build skillz (debug)
    cmd: cargo build

  install:
    desc: Fresh release build of skillz (dependencies stay cached), replacing the symlink in ~/.local/bin
    cmds:
      - cargo clean --release -p skillz
      - rm -f "$HOME/.local/bin/skillz"
      - cargo build --release
      - mkdir -p "$HOME/.local/bin"
      - ln -sf "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/skillz" "$HOME/.local/bin/skillz"

  test:
    desc: All tests, killed (with the whole process tree) if the run outlives five minutes
    cmd: python3 scripts/with_timeout.py 300 cargo test
