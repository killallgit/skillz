[package]
name = "skillz"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fuzzy-matcher = "0.3.7"
glob = "0.3.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shell-words = "1.1.1"
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
