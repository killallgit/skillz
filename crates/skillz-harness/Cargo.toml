[package]
name = "skillz-harness"
version = "0.1.0"
edition = "2024"

[features]
# Lets the CLI parse `Agent` from the command line.
clap = ["dep:clap"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"], optional = true }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shell-words = "1.1.1"
tempfile = "3.27.0"
toml_edit = { version = "0.25.17", features = ["serde"] }
yaml-rust2 = "0.13.0"
